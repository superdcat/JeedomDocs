# Configuration du site de documentation des plugins Jeedom.
# Les sources vivent dans docs/<plugin>/ : une rubrique par plugin,
# toutes les langues d'un plugin dans le meme dossier (suffixe .fr / .en / .de / .es).

site_name: Documentation des plugins Jeedom
site_description: Documentation et changelogs des plugins Jeedom de superdcat
site_author: superdcat
site_url: https://jeedomdocs.decastro.fr/

repo_url: https://github.com/superdcat/JeedomDocs
repo_name: superdcat/JeedomDocs
edit_uri: edit/main/docs/

copyright: Documentation des plugins Jeedom

theme:
  name: material
  language: fr
  # Habillage Jeedom : barre du haut et numerotation des titres.
  # Le detail est dans overrides/ et docs/assets/jeedom.css.
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  # Barre du haut blanche comme sur doc.jeedom.com ; le vert Jeedom est
  # defini en accent dans docs/assets/jeedom.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.tracking
    - navigation.sections
    # 'navigation.indexes' est incompatible avec 'toc.integrate' : le theme
    # ne range le sommaire dans la colonne de gauche que pour la page
    # courante, et une page d'index de rubrique n'en est pas une.
    # La documentation d'un plugin apparait donc comme une entree de sa
    # rubrique, au meme titre que son changelog.
    - navigation.top
    - toc.follow
    # Sommaire de la page range dans la colonne de gauche, comme chez Jeedom.
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search
  # i18n : structure par suffixe -> docs/<plugin>/index.fr.md, index.en.md, ...
  # Une page non traduite retombe automatiquement sur le francais.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
          site_name: Documentation des plugins Jeedom
        - locale: en
          name: English
          build: true
          site_name: Jeedom plugins documentation
          nav_translations:
            Accueil: Home
        - locale: de
          name: Deutsch
          build: true
          site_name: Dokumentation der Jeedom-Plugins
          nav_translations:
            Accueil: Startseite
        - locale: es
          name: Español
          build: true
          site_name: Documentación de los plugins Jeedom
          nav_translations:
            Accueil: Inicio

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/jeedom.css

extra:
  # Liens de la barre du haut, repris de la documentation Jeedom officielle.
  jeedom_links:
    - name: Site
      link: https://www.jeedom.com
    - name: Blog
      link: https://blog.jeedom.com
    - name: Community
      link: https://community.jeedom.com
    - name: Market
      link: https://market.jeedom.com
    - name: Doc
      link: https://doc.jeedom.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/superdcat
      name: GitHub

# La navigation est deduite de l'arborescence de docs/ : ajouter un plugin,
# c'est ajouter un dossier, sans toucher a ce fichier. Le hook applique le
# libelle facultatif declare dans docs/<plugin>/.title
hooks:
  # Traduit l'arborescence Jeedom (<plugin>/fr_FR/index.md) vers la forme
  # attendue par i18n. Doit rester en premier.
  - hooks/jeedom_locales.py
  - hooks/nav_titles.py
  # Ecarte de la numerotation automatique les pages deja numerotees.
  - hooks/heading_numbers.py
  # Tableau des plugins des pages d'accueil.
  - hooks/plugin_index.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
